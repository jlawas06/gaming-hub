<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bunting" aria-hidden="true"></div>
    <div class="container">
        <header class="site-header">
            <p class="eyebrow">Perya Classic</p>
            <h1>Color Game</h1>
        </header>

        <div class="game-layout">
        <div class="stats-section">
            <h3>Color Board</h3>
            <div class="stats-grid">
                <div class="color-stat red">
                    <span class="color-name">Red</span>
                    <span class="color-percent" id="redPercent">0%</span>
                </div>
                <div class="color-stat green">
                    <span class="color-name">Green</span>
                    <span class="color-percent" id="greenPercent">0%</span>
                </div>
                <div class="color-stat blue">
                    <span class="color-name">Blue</span>
                    <span class="color-percent" id="bluePercent">0%</span>
                </div>
                <div class="color-stat yellow">
                    <span class="color-name">Yellow</span>
                    <span class="color-percent" id="yellowPercent">0%</span>
                </div>
                <div class="color-stat white">
                    <span class="color-name">White</span>
                    <span class="color-percent" id="whitePercent">0%</span>
                </div>
                <div class="color-stat pink">
                    <span class="color-name">Pink</span>
                    <span class="color-percent" id="pinkPercent">0%</span>
                </div>
            </div>
            <p class="total-rolls">Total Rolls: <span id="totalRolls">0</span></p>
        </div>

        <div class="game-section">
            <div class="dice-stage">
            <div class="dice-container" id="diceContainer">
                <div class="die-scene">
                    <div class="die-shadow"></div>
                    <div class="die-bounce">
                        <div class="die-cube" id="dice1">
                            <div class="die-face face-front red"></div>
                            <div class="die-face face-back blue"></div>
                            <div class="die-face face-right green"></div>
                            <div class="die-face face-left yellow"></div>
                            <div class="die-face face-top white"></div>
                            <div class="die-face face-bottom pink"></div>
                        </div>
                    </div>
                </div>
                <div class="die-scene">
                    <div class="die-shadow"></div>
                    <div class="die-bounce">
                        <div class="die-cube" id="dice2">
                            <div class="die-face face-front red"></div>
                            <div class="die-face face-back blue"></div>
                            <div class="die-face face-right green"></div>
                            <div class="die-face face-left yellow"></div>
                            <div class="die-face face-top white"></div>
                            <div class="die-face face-bottom pink"></div>
                        </div>
                    </div>
                </div>
                <div class="die-scene">
                    <div class="die-shadow"></div>
                    <div class="die-bounce">
                        <div class="die-cube" id="dice3">
                            <div class="die-face face-front red"></div>
                            <div class="die-face face-back blue"></div>
                            <div class="die-face face-right green"></div>
                            <div class="die-face face-left yellow"></div>
                            <div class="die-face face-top white"></div>
                            <div class="die-face face-bottom pink"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="result-section">
                <p id="resultMessage" aria-live="polite"></p>
            </div>
            </div>

            <div class="controls">
                <button id="rollDiceBtn">Roll Dice</button>
                <button id="resetStatsBtn">Reset Stats</button>
            </div>
        </div>

        <div class="history-section">
            <h3>Roll History</h3>
            <ul id="gameHistory"></ul>
        </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
