<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deal or No Deal — JL Gaming Hub</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <main class="studio">
        <header class="topbar">
            <a href="../" class="back-link">&larr; All booths</a>
            <h1 class="studio-title">Deal or No Deal</h1>
            <div class="topbar-actions">
                <button id="settings-btn" class="icon-btn" aria-label="Open settings">⚙️</button>
            </div>
        </header>

        <p class="game-message" role="status"></p>

        <div class="game-info">
            <div class="podium current-offer">
                <h2>Banker's offer</h2>
                <div class="offer-amount">₱0</div>
            </div>
            <div class="podium player-case">
                <h2>Your case</h2>
                <div class="case-label">Case #<span id="player-case">?</span></div>
            </div>
            <div class="podium cases-counter">
                <h2>Open this round</h2>
                <div class="counter">0</div>
            </div>
        </div>

        <div class="game-content">
            <div class="game-main">
                <div class="cases-grid">
                    <!-- Cases will be generated by JavaScript -->
                </div>

                <div class="game-controls">
                    <button id="deal-btn" class="btn deal">Deal</button>
                    <button id="no-deal-btn" class="btn no-deal">No deal</button>
                </div>
            </div>

            <aside class="prize-list" aria-label="Money board">
                <h2>The board</h2>
                <div class="prizes-grid">
                    <!-- Prizes will be generated by JavaScript -->
                </div>
            </aside>
        </div>
    </main>

    <div id="deal-popup" class="popup">
        <div class="popup-content banker-card">
            <p class="banker-eyebrow">The banker is on the phone</p>
            <h2>Deal or no deal?</h2>
            <p class="banker-offer-line">His offer for your case:</p>
            <p class="popup-offer">₱0</p>
            <div class="popup-buttons">
                <button id="popup-deal-btn" class="btn deal">Deal</button>
                <button id="popup-no-deal-btn" class="btn no-deal">No deal</button>
            </div>
        </div>
    </div>

    <div id="settings-popup" class="popup">
        <div class="popup-content settings-card">
            <h2>Settings</h2>
            <div class="settings-form">
                <div class="prize-inputs">
                    <div class="prize-list-input">
                        <label>Top prizes (₱)</label>
                        <div class="prize-input-group">
                            <input type="number" class="prize-input" value="50" min="1">
                            <input type="number" class="prize-input" value="100" min="1">
                            <input type="number" class="prize-input" value="200" min="1">
                        </div>
                    </div>
                    <div class="prize-list-input">
                        <label>Regular prizes (₱)</label>
                        <div class="prize-input-group regular-prizes">
                            <!-- Regular prize inputs will be generated by JavaScript -->
                        </div>
                    </div>
                </div>
                <div class="settings-buttons">
                    <button id="restore-defaults" class="btn btn-plain">Restore defaults</button>
                    <button id="cancel-settings" class="btn btn-plain">Cancel</button>
                    <button id="save-settings" class="btn deal">Save settings</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
