<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Caller — JL Gaming Hub</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <main class="hall">
        <header class="topbar">
            <a href="../" class="back-link">&larr; All booths</a>
            <h1 class="hall-title">Bingo Caller</h1>
            <div class="topbar-actions">
                <button id="muteBtn" class="icon-btn" aria-label="Mute the caller voice">🔊</button>
                <button id="settingsBtn" class="icon-btn" aria-label="Open settings">⚙️</button>
            </div>
        </header>

        <!-- Current call + controls -->
        <section class="stage" aria-label="Current call and controls">
            <div id="ballDisplay" class="ball" data-letter="">
                <div class="ball-face">
                    <div id="currentLetter" class="ball-letter"></div>
                    <div id="currentNumber" class="ball-number">&ndash;</div>
                </div>
            </div>

            <div class="stage-panel">
                <p class="stage-status">
                    <span class="status-label">Previous</span>
                    <span id="lastCalled" class="status-value">&mdash;</span>
                    <span class="status-sep" aria-hidden="true">&middot;</span>
                    <span class="status-value"><span id="numbersCalledCount">0</span>/75</span>
                    <span class="status-label">called</span>
                    <span class="status-sep" aria-hidden="true">&middot;</span>
                    <span id="remainingCount" class="status-value">75</span>
                    <span class="status-label">to go</span>
                </p>

                <div class="main-controls">
                    <button id="startPauseBtn" class="btn btn-start">Start</button>
                    <button id="newGameBtn" class="btn btn-ghost">New game</button>
                    <button id="bingoWinnerBtn" class="btn btn-bingo">Bingo!</button>
                </div>

                <div class="secondary-controls">
                    <label class="interval-control" for="intervalSelect">
                        Call every
                        <select id="intervalSelect">
                            <option value="1">1s</option>
                            <option value="2">2s</option>
                            <option value="3">3s</option>
                            <option value="4">4s</option>
                            <option value="5" selected>5s</option>
                            <option value="6">6s</option>
                            <option value="7">7s</option>
                            <option value="8">8s</option>
                            <option value="9">9s</option>
                            <option value="10">10s</option>
                        </select>
                    </label>
                    <p class="shortcut-hint">Space start/pause &middot; N new game &middot; M mute &middot; B bingo</p>
                </div>
            </div>
        </section>

        <!-- Flashboard -->
        <section class="flashboard" aria-label="Number board">
            <div id="bingoGrid" class="board"></div>
        </section>

        <!-- Call history -->
        <section class="call-history" aria-label="Call history">
            <h2 class="history-label">Call history</h2>
            <div class="logs-container" id="callLogsContainer">
                <div class="no-logs">No numbers called yet</div>
            </div>
        </section>
    </main>

    <!-- Confetti Container -->
    <div id="confettiContainer" class="confetti-container"></div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="close-btn" aria-label="Close settings">&times;</button>
            </div>
            <div class="modal-body">
                <div class="settings-group">
                    <h3>Caller voice</h3>
                    <div class="setting-item">
                        <label for="speechRate">Speed</label>
                        <input type="range" id="speechRate" min="0.5" max="2" step="0.1" value="0.9">
                        <span class="value-display">0.9</span>
                    </div>
                    <div class="setting-item">
                        <label for="speechPitch">Pitch</label>
                        <input type="range" id="speechPitch" min="0.5" max="2" step="0.1" value="1">
                        <span class="value-display">1.0</span>
                    </div>
                    <div class="setting-item">
                        <label for="speechVolume">Volume</label>
                        <input type="range" id="speechVolume" min="0" max="1" step="0.1" value="1">
                        <span class="value-display">1.0</span>
                    </div>
                </div>
                <div class="settings-group">
                    <h3>Game</h3>
                    <div class="setting-item">
                        <label for="defaultInterval">Seconds between calls</label>
                        <input type="number" id="defaultInterval" min="1" max="10" value="5">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="saveSettings" class="btn btn-start">Save settings</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
